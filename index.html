<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário De Adoção</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <h2>Formulário de Adoção</h2>

    </nav>
    <form id="formAdocao">
        <label for="nome">nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">
        <br>
        <label for="email">email:</label>
        <input type="email" id="email" placeholder="Digite seu email">
        <br>
        <label for="idade">idade:</label>
        <input type="number" id="idade" placeholder="Digite seu idade">
        <br>

        <label for="idade">idade:</label>
        <input type="number" id="idade" placeholder="Digite seu idade">
        <br>

        <label for="telefone">telefone:</label>
        <input type="number" id="telefone" placeholder="Digite seu telefone">
        <br>
         <label for="cpf">cpf:</label>
        <input type="number" id="cpf" placeholder="Digite seu cpf">
        <br>
        <label for="motivo">motivo:</label>
        <input type="text" id="motivo" placeholder="Digite seu motivo">
        <br>


        <label for="moradia"> moradia: </label>
        <select name="moradia" id="moradia">
            <option value=""> Selecione</option>
            <option value="casa">Casa</option>
            <option value="apartamento">Apartamento</option>
        </select>
        <br>
         <label for="apt">casa permite pet?</label>
        <input type="radio" name="apt" value="aptsim">Sim
        <input type="radio" name="apt" value="aptnao">Não moro em apto
        <br>
        <label for="quintal">Possui Quintal?</label>
        <input type="radio" name="quintal" value="sim">Sim
        <input type="radio" name="quintal" value="nao">Não
        <br>
        <label for="jateve">ja teve cachorro?</label>
        <input type="radio" name="jateve" value="simteve">Sim
        <input type="radio" name="jateve" value="naoteve">Não
        <br>

        <label for="cidade">cidade:</label>
        <input type="text" id="cidade" placeholder="Digite seu cidade">
        <br>
        <button class="butao" type="submit">enviar</button>
    </form>
    <div id="resultado"></div>
    <script src="scripts/script.js"></script>
</body>

</html>
